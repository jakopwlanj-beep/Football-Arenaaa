name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q FOMC_android.zip

      - name: Pin python-for-android and NDK
        run: |
          sed -i -e '/^\[app\]/a p4a.branch = v2024.01.21' -e '/^\[app\]/a android.ndk = 25b' FOMC_android/buildozer.spec

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install Buildozer
        run: pip install buildozer "cython<3" setuptools wheel

      - name: Build APK (with retries and CMake patch)
        working-directory: FOMC_android
        run: |
          for i in 1 2 3; do
            P4A=.buildozer/android/platform/python-for-android/pythonforandroid
            if [ -d "$P4A" ]; then
              grep -rl "'Unix Makefiles'" "$P4A" | xargs -r sed -i "/CMAKE_POLICY_VERSION_MINIMUM/!s/'-G', 'Unix Makefiles',/'-G', 'Unix Makefiles', '-DCMAKE_POLICY_VERSION_MINIMUM=3.5',/"
              echo "Patched recipes:"
              grep -rn "CMAKE_POLICY_VERSION_MINIMUM" "$P4A" | head
            fi
            buildozer -v android debug && exit 0
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballArena-apk
          path: FOMC_android/bin/*.apk
