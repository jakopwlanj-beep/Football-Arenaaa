name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q FOMC_android.zip

      - name: Pin python-for-android and NDK
        run: |
          sed -i -e '/^\[app\]/a p4a.branch = v2024.01.21' -e '/^\[app\]/a android.ndk = 25b' FOMC_android/buildozer.spec
          cat FOMC_android/buildozer.spec

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install Buildozer
        run: pip install buildozer "cython<3" setuptools wheel

      - name: Build APK
        working-directory: FOMC_android
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballArena-apk
          path: FOMC_android/bin/*.apk
