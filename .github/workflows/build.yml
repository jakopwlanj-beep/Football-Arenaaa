name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -q FOMC_android.zip
          mkdir -p ~/.android
          cp FOMC_android/debug.keystore ~/.android/debug.keystore

      - name: Prepare patched python-for-android
        run: |
          git clone --branch v2024.01.21 --depth 1 https://github.com/kivy/python-for-android.git "$HOME/p4a"
          grep -rl "'Unix Makefiles'" "$HOME/p4a/pythonforandroid" | xargs -r sed -i "s/'-G', 'Unix Makefiles',/'-G', 'Unix Makefiles', '-DCMAKE_POLICY_VERSION_MINIMUM=3.5',/"
          grep -rl "'CMakeFiles/'" "$HOME/p4a/pythonforandroid" | xargs -r sed -i "s/'-f', 'CMakeCache.txt', 'CMakeFiles\/'/'-rf', 'CMakeCache.txt', 'CMakeFiles\/'/"
          sed -i -e "/^\[app\]/a p4a.source_dir = $HOME/p4a" -e '/^\[app\]/a android.ndk = 25b' FOMC_android/buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3==3.10.12,hostpython3==3.10.12,pygame/' FOMC_android/buildozer.spec
          cat FOMC_android/buildozer.spec

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install Buildozer
        run: pip install buildozer "cython<3" setuptools wheel

      - name: Build APK (with retries)
        working-directory: FOMC_android
        run: |
          for i in 1 2 3; do
            buildozer -v android debug && exit 0
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Show signing key fingerprints
        run: |
          APKSIGNER=$(find "$HOME/.buildozer" -name apksigner 2>/dev/null | head -1)
          echo "APK signed with:"
          "$APKSIGNER" verify --print-certs FOMC_android/bin/*.apk | grep -i "SHA-256" || true
          echo "Our keystore:"
          keytool -list -keystore FOMC_android/debug.keystore -storepass android | grep -i "SHA-256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballArena-apk
          path: FOMC_android/bin/*.apk
